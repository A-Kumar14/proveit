name: ASL Assistant platforms

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/signbridge-platform.yml"
      - "examples/signbridge/**"
      - "signbridge_service/**"
      - "tests/test_signbridge_service.py"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".github/workflows/signbridge-platform.yml"
      - "examples/signbridge/**"
      - "signbridge_service/**"
      - "tests/test_signbridge_service.py"

concurrency:
  group: signbridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/signbridge/requirements.txt

      - name: Set up ASL Assistant on Windows
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File examples/signbridge/setup.ps1

      - name: Set up ASL Assistant on macOS/Linux
        if: runner.os != 'Windows'
        run: bash examples/signbridge/setup.sh

      - name: Check model startup and inference
        if: runner.os == 'Windows'
        run: '& .\.venv-signbridge\Scripts\python.exe .\examples\signbridge\check_environment.py'

      - name: Check model startup and inference
        if: runner.os != 'Windows'
        run: .venv-signbridge/bin/python examples/signbridge/check_environment.py

      - name: Run service protocol tests
        if: runner.os == 'Windows'
        run: '& .\.venv-signbridge\Scripts\python.exe -m unittest discover -s tests -v'

      - name: Run service protocol tests
        if: runner.os != 'Windows'
        run: .venv-signbridge/bin/python -m unittest discover -s tests -v
